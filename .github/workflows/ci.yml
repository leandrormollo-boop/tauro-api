name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: taurotest
          POSTGRES_DB: tauro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tauro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:taurotest@127.0.0.1:5432/tauro_test
      TAURO_TEST_DATABASE_URL: postgresql://postgres:taurotest@127.0.0.1:5432/tauro_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.txt

      - name: Instalar dependencias Python bloqueadas
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock -r requirements-test.txt
          python -m pip check

      - name: Migrar PostgreSQL
        run: python scripts/migrate_database.py

      - name: Suite Python
        run: python -m pytest -q --junitxml=docs/evidence/pr28-hardening-junit.xml

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: |
            shopify_app/package-lock.json
            tiendanube_nube_app/package-lock.json

      - name: Shopify — test, typecheck y build
        working-directory: shopify_app
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build -- --skip-dependencies-installation

      - name: Tiendanube — test, typecheck y build
        working-directory: tiendanube_nube_app
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
          git diff --exit-code -- dist/main.min.js

      - name: Publicar JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr28-hardening-junit
          path: docs/evidence/pr28-hardening-junit.xml
          if-no-files-found: warn
          retention-days: 14
