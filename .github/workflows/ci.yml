name: CI

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-build:
    name: Imagen Docker reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen sin publicar
        run: docker build --tag tauro:audit-${{ github.sha }} .

  python-audit:
    name: Python 3.11 y PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: tauro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tauro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Los fixtures usan CURRENT_DATE; debe ser el mismo día operativo que
      # los controles de pagos de TAURO, incluso entre 00:00 y 03:00 UTC.
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
      TAURO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tauro_test
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Fijar cliente PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: Instalar runtime bloqueado
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          python -m pip check
      - name: Instalar runner de pruebas fijado
        run: >-
          python -m pip install
          pytest==9.1.1
          iniconfig==2.3.0
          packaging==26.3
          pluggy==1.6.0
          pygments==2.21.0
          httpx2==2.13.1
          httpcore2==2.13.1
          truststore==0.10.4
          httpx==0.28.1
          httpcore==1.0.9
      - name: Probar la suite completa
        run: |
          # Toda la suite, no una lista fija: una lista de 'auditados' dejó
          # 128 archivos sin correr y 20 tests rotos con el semáforo verde.
          python -m pytest -q tests/

  web-audit:
    name: Build web y contratos JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias web
        run: npm ci
      - name: Compilar sitio publico y verificar bundle
        run: |
          npm run build:web
          git diff --exit-code -- static/js/app.js
      - name: Probar contratos JavaScript auditados
        run: >-
          node --test
          tests/js/payment-allocation.test.cjs
          tests/js/pago-preview.test.cjs
          tests/js/quote-request.test.cjs
          tests/js/quote-locations.test.cjs
          tests/js/quote-comparison.test.cjs
          tests/js/presentacion-portal.test.cjs
          tests/js/shipment-focus.test.cjs
          tests/js/dropdown-dismiss.test.cjs
          tests/js/web-quote-presentation.test.cjs
          tests/js/web-quote-national.test.cjs
          tests/js/admin-precios-web.test.cjs
          tests/js/quote-route-map.test.cjs
          tests/js/hs-assistant.test.cjs
          tests/js/invoice-totales.test.cjs
          tests/js/portal-agenda.test.cjs
          tests/js/invoice-asistente.test.cjs

  ci:
    name: ci
    if: ${{ always() }}
    needs: [container-build, python-audit, web-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exigir que todos los controles hayan pasado
        env:
          CONTAINER_BUILD_RESULT: ${{ needs.container-build.result }}
          PYTHON_AUDIT_RESULT: ${{ needs.python-audit.result }}
          WEB_AUDIT_RESULT: ${{ needs.web-audit.result }}
        run: |
          test "$CONTAINER_BUILD_RESULT" = "success"
          test "$PYTHON_AUDIT_RESULT" = "success"
          test "$WEB_AUDIT_RESULT" = "success"
