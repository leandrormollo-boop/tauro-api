name: CI

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-build:
    name: Imagen Docker reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen sin publicar
        run: docker build --tag tauro:audit-${{ github.sha }} .

  python-audit:
    name: Python 3.11 y PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: tauro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tauro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TAURO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tauro_test
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Fijar cliente PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: Instalar runtime bloqueado
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          python -m pip check
      - name: Instalar runner de pruebas fijado
        run: >-
          python -m pip install
          pytest==9.1.1
          iniconfig==2.3.0
          packaging==26.3
          pluggy==1.6.0
          pygments==2.21.0
          httpx2==2.13.1
          httpcore2==2.13.1
          truststore==0.10.4
          httpx==0.28.1
          httpcore==1.0.9
      - name: Probar controles auditados y presentación web
        run: |
          python -m pytest \
            tests/test_integridad_pagos_postgres.py \
            tests/test_adjuntar_comprobante_pago_postgres.py \
            tests/test_adjuntar_comprobante_portal.py \
            tests/test_adjuntar_comprobante_admin.py \
            tests/test_pagos_documentales_postgres.py \
            tests/test_imputacion_pagos_portal.py \
            tests/test_conciliacion_couriers_postgres.py \
            tests/test_libreta_aislada.py \
            tests/test_visibilidad_envios_cliente.py \
            tests/test_invoice_marca.py \
            tests/test_portal_pdf_unificado.py \
            tests/test_documentos_portal.py \
            tests/test_numeracion_guias_tauro.py \
            tests/test_shopify_catalogo_postgres.py \
            tests/test_fedex_emision_recuperacion.py \
            tests/test_dhl_emision.py \
            tests/test_dhl_client.py \
            tests/test_cotizar_sentido.py \
            tests/test_portal_experiencia_cliente.py \
            tests/test_accesos_directos.py \
            tests/test_cotizacion_portal_handoff.py \
            tests/test_ubicaciones_handoff.py \
            tests/test_control_automatizaciones.py \
            tests/test_backup_privacy.py \
            tests/test_restauracion_aislada.py \
            tests/test_experiencia_cuenta.py \
            tests/test_periodo_cuenta.py \
            tests/test_periodo_visual_cuenta.py \
            tests/test_portal_cuenta_experiencia.py \
            tests/test_portal_cuenta_ambitos_ux.py \
            tests/test_admin_cuenta_ambitos.py \
            tests/test_admin_pago_revision_ui.py \
            tests/test_ups_emision.py \
            tests/test_monitoreo_guias_reemplazadas.py \
            tests/test_recolecciones_portal_claridad.py \
            tests/test_recolecciones_permiso.py \
            tests/test_recolecciones_concurrencia.py \
            tests/test_recolecciones_origen_servicio.py \
            tests/test_recolecciones_origen_migracion.py \
            tests/test_pickup_dhl.py \
            tests/test_edicion_solicitud_postgres.py \
            tests/test_envio_gestion.py \
            tests/test_portal_mis_clientes.py \
            tests/test_estadisticas_contactos.py \
            tests/test_portal_home_panorama.py \
            tests/test_agenda_nacional.py \
            tests/test_carrier_contract.py \
            tests/test_tiendanube_app.py \
            tests/test_tiendanube_preflight.py \
            tests/test_admin_negocio_postgres.py \
            tests/test_control_negocio.py \
            tests/test_numeros_operativos_fail_closed.py \
            tests/test_dhl_financial_safety.py \
            tests/test_cotizador_publico_ambito.py \
            tests/test_cotizador_publico_nacional.py \
            tests/test_precios_web_nacional.py \
            tests/test_precios_web_nacional_postgres.py \
            tests/test_admin_precios_web.py \
            tests/test_oca_adapter.py \
            tests/test_quote_result_experience.py \
            tests/test_integraciones_contacto.py \
            tests/test_operator_catalog_ui.py \
            tests/test_precio_web_fedex.py \
            tests/test_smart_select_public.py \
            tests/test_web_copy_parise_369.py \
            tests/test_importacion_cuenta_cliente.py \
            tests/test_cuenta_corriente_presentacion_postgres.py \
            tests/test_diferencia_tax_envio.py \
            tests/test_diferencias_cliente.py \
            tests/test_portal_raiz.py \
            tests/test_cliente_cuenta_prueba_postgres.py \
            tests/test_invoice_asistente.py

  web-audit:
    name: Build web y contratos JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias web
        run: npm ci
      - name: Compilar sitio publico y verificar bundle
        run: |
          npm run build:web
          git diff --exit-code -- static/js/app.js
      - name: Probar contratos JavaScript auditados
        run: >-
          node --test
          tests/js/payment-allocation.test.cjs
          tests/js/pago-preview.test.cjs
          tests/js/quote-request.test.cjs
          tests/js/quote-locations.test.cjs
          tests/js/shipment-location-confirmation.test.cjs
          tests/js/web-quote-presentation.test.cjs
          tests/js/web-quote-national.test.cjs
          tests/js/quote-route-map.test.cjs
          tests/js/hs-assistant.test.cjs
          tests/js/invoice-totales.test.cjs
          tests/js/portal-agenda.test.cjs
          tests/js/invoice-asistente.test.cjs

  ci:
    name: ci
    if: ${{ always() }}
    needs: [container-build, python-audit, web-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exigir que todos los controles hayan pasado
        env:
          CONTAINER_BUILD_RESULT: ${{ needs.container-build.result }}
          PYTHON_AUDIT_RESULT: ${{ needs.python-audit.result }}
          WEB_AUDIT_RESULT: ${{ needs.web-audit.result }}
        run: |
          test "$CONTAINER_BUILD_RESULT" = "success"
          test "$PYTHON_AUDIT_RESULT" = "success"
          test "$WEB_AUDIT_RESULT" = "success"
