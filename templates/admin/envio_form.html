{% extends "admin/base_admin.html" %}
{% block title %}Cargar factura{% endblock %}

{% block content %}
<div class="page-title">
  <div class="eyebrow">Cuenta corriente</div>
  <h1>Cargar factura / envío</h1>
</div>

<div class="card" style="max-width:560px;">
  <form method="POST" action="/admin/envios/nuevo" enctype="multipart/form-data">
    <input type="hidden" name="idempotency_key" value="{{ idempotency_key }}">

    <div class="form-group">
      <label>Cliente *</label>
      <select name="cliente_id" required>
        <option value="">— Seleccioná —</option>
        {% for c in clientes %}
        <option value="{{ c.cliente_id }}" {% if c.cliente_id == preselect_cliente %}selected{% endif %}>
          {{ c.cliente_id }} — {{ c.nombre or c.email }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label>Fecha *</label>
        <input type="date" name="fecha" required value="{{ form_data.fecha if form_data else today }}">
      </div>
      <div class="form-group">
        <label>Nro. Factura</label>
        <input type="text" name="nro_fc" value="{{ form_data.nro_fc if form_data else '' }}" placeholder="0106-00001234">
      </div>
    </div>

    <div class="form-group">
      <label>Monto ARS *</label>
      <input type="text" name="monto_ars" required inputmode="decimal" data-numero="monto"
             value="{{ form_data.monto_ars if form_data else '' }}" placeholder="150.000 o 150,000">
    </div>

    <div class="form-group">
      <label>Ámbito contable *</label>
      <select name="ambito" required>
        <option value="">— Seleccioná —</option>
        <option value="NACIONAL" {% if form_data and form_data.ambito == 'NACIONAL' %}selected{% endif %}>Nacional</option>
        <option value="INTERNACIONAL" {% if form_data and form_data.ambito == 'INTERNACIONAL' %}selected{% endif %}>Internacional</option>
      </select>
      <small style="color:var(--fg-4);">Debe coincidir con la ruta del envío; el courier no define el ámbito.</small>
    </div>

    <div class="form-group">
      <label>Descripción</label>
      <input type="text" name="descripcion" value="{{ form_data.descripcion if form_data else '' }}" placeholder="Envío FEDEX a USA · 3 piezas">
    </div>

    <div class="form-group">
      <label>Tracking</label>
      <input type="text" name="tracking" value="{{ form_data.tracking if form_data else '' }}" placeholder="7489270349280">
    </div>

    <div class="form-group">
      <label>Estado</label>
      <select name="estado">
        <option value="ACTIVO" {% if not form_data or form_data.estado == 'ACTIVO' %}selected{% endif %}>Activo</option>
        <option value="CANCELADO" {% if form_data and form_data.estado == 'CANCELADO' %}selected{% endif %}>Cancelado</option>
      </select>
      <small style="color:var(--fg-4);">Las notas de crédito no se cargan como facturas.</small>
    </div>

    <div class="form-group">
      <label>PDF de la factura (opcional)</label>
      <input type="file" name="factura_pdf"
             accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">
    </div>

    <div style="display:flex;gap:12px;margin-top:8px;">
      <button type="submit" class="btn btn-primary">Guardar factura</button>
      <a href="/admin/home" class="btn btn-ghost">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
