<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar acceso · Tauro Admin</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png?v=2">
  <link rel="stylesheet" href="/static/css/tauro.css?v=17">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
  <div class="login-card fade-up">
    <h1>Recuperando acceso</h1>
    <p class="sub" id="recupero-estado">Validando el link seguro…</p>

    <form method="POST" action="/admin/recuperar/canjear" id="admin-recupero-form" hidden>
      <input type="hidden" name="token" id="admin-recupero-token" value="">
      <button type="submit" class="btn btn-primary btn-full">Continuar</button>
    </form>

    <div id="admin-recupero-error" class="msg error" role="alert" hidden>
      El link no es válido. Solicitá uno nuevo desde el ingreso al panel.
    </div>
    <p style="text-align:center;margin-top:18px;">
      <a href="/admin/login" style="font-size:12.5px;color:var(--fg-3);">← Volver al ingreso</a>
    </p>
  </div>
</div>
<script nonce="{{ request.state.csp_nonce }}">
(function () {
  "use strict";
  var fragment = window.location.hash.length > 1 ? window.location.hash.slice(1) : "";
  var token = new URLSearchParams(fragment).get("token") || "";
  window.history.replaceState(null, document.title, "/admin/recuperar");
  fragment = "";
  var form = document.getElementById("admin-recupero-form");
  var error = document.getElementById("admin-recupero-error");
  if (/^[A-Za-z0-9_-]{32,256}$/.test(token)) {
    document.getElementById("admin-recupero-token").value = token;
    token = "";
    form.hidden = false;
    document.getElementById("recupero-estado").textContent = "Link verificado. Ingresando al panel…";
    form.requestSubmit();
  } else {
    token = "";
    document.getElementById("recupero-estado").hidden = true;
    error.hidden = false;
  }
}());
</script>
</body>
</html>
