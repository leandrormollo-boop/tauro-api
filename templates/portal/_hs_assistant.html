<div class="hs-assistant" data-hs-assistant>
    <details>
        <summary>Ayuda para encontrar el HS code</summary>
        <p>Buscamos al completar la descripción del producto. Podés agregar detalles en español o inglés.</p>
        <label>Material, composición y uso
            <input type="text" data-hs-details maxlength="700" placeholder="Ej.: 100% algodón, tejido de punto, para vestir">
        </label>
        <button type="button" class="btn btn-ghost btn-sm" data-hs-search>Buscar clasificación</button>
    </details>
    <div data-hs-status role="status" aria-live="polite"></div>
    <div data-hs-results></div>
    <small>El HS común tiene 6 dígitos. El destino puede exigir una extensión nacional. Confirmá que el código describa tu producto.</small>
</div>
