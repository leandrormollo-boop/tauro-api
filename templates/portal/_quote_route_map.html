<aside class="quote-route-map" data-quote-map aria-label="Mapa de origen y destino" hidden>
  <div class="quote-map-heading"><span class="quote-map-live-dot" aria-hidden="true"></span> TU ENVÍO, EN EL MUNDO</div>
  <div class="quote-map-art">
    {% include 'portal/_quote_map_brand.html' %}
    <canvas data-map-canvas tabindex="0" role="img" aria-roledescription="globo interactivo" aria-label="Mapa del mundo. Arrastrá para girar. Con teclado, usá las flechas para girar, más y menos para acercar y alejar, e Inicio para volver a la ruta."></canvas>
    <svg class="quote-map-glint" data-map-glint aria-hidden="true" focusable="false" preserveAspectRatio="none">
      <defs>
        <linearGradient data-map-glint-gradient x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8b6bf7" stop-opacity="0"/>
          <stop offset=".37" stop-color="#7c4dff" stop-opacity=".25"/>
          <stop offset=".465" stop-color="#aa86ff" stop-opacity=".65"/>
          <stop offset=".495" stop-color="#f6f0ff"/>
          <stop offset=".51" stop-color="#e9ddff" stop-opacity=".85"/>
          <stop offset=".54" stop-color="#8b6bf7" stop-opacity=".65"/>
          <stop offset=".66" stop-color="#8b6bf7" stop-opacity=".08"/>
          <stop offset="1" stop-color="#8b6bf7" stop-opacity="0"/>
        </linearGradient>
        <mask data-map-glint-mask maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
          <path data-map-glint-land fill="white"/>
          <path data-map-glint-route fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </mask>
      </defs>
      <g class="quote-map-glint-layer" data-map-glint-layer>
        <rect class="quote-map-glint-band" data-map-glint-band x="-55%" y="-30%" width="55%" height="160%"/>
      </g>
      <g class="quote-map-current-glow">
        <path class="quote-map-current is-trail" data-map-current pathLength="100"/>
        <path class="quote-map-current is-core" data-map-current pathLength="100"/>
      </g>
    </svg>
    <div class="quote-map-explore-bar">
      <span class="quote-map-drag-hint" data-map-drag-hint>Arrastrá para girar</span>
      <div class="quote-map-controls" role="group" aria-label="Vista del mapa">
        <button type="button" data-map-zoom="out" aria-label="Alejar mapa" title="Alejar">−</button>
        <button type="button" data-map-zoom="in" aria-label="Acercar mapa" title="Acercar">+</button>
        <button type="button" data-map-reset aria-label="Volver a la ruta" title="Volver a la ruta">↺</button>
      </div>
    </div>
  </div>
  <div class="quote-map-itinerary" aria-live="polite" aria-atomic="true">
    <div class="quote-map-endpoint"><span class="quote-map-pin is-origin" aria-hidden="true"></span><div><small>ORIGEN</small><strong data-map-origin>Elegí origen</strong><span data-map-origin-country></span></div></div>
    <span class="quote-map-connector" aria-hidden="true">↗</span>
    <div class="quote-map-endpoint"><span class="quote-map-pin" aria-hidden="true"></span><div><small>DESTINO</small><strong data-map-destination>Elegí destino</strong><span data-map-destination-country></span></div></div>
  </div>
  <div class="quote-map-footer"><span data-map-caption>Completá las ciudades para ver la conexión.</span><button type="button" class="quote-map-toggle" aria-pressed="false" data-map-toggle>Ocultar mapa</button></div>
  <span class="quote-map-credit">Cartografía · Natural Earth</span>
</aside>
