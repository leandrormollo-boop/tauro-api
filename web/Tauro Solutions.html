  <!-- Bundle único, compilado con esbuild (React + los componentes adentro).
       Antes: React de desarrollo + Babel compilando JSX en el navegador desde
       unpkg (~5 MB, y ningún CDN de terceros permitido bajo CSP). Ahora: un
       archivo propio, minificado, servido desde /static — eso es lo que
       habilita `script-src 'self'`.
       Para editar la web: tocar web/components/*.jsx y correr
       `npm run build:web` (o `node scripts/build_web.mjs`), después bumpear
       el ?v=N. El bundle se COMMITEA: Railway no tiene node. -->
  <script src="/static/js/app.js?v=3"></script>
